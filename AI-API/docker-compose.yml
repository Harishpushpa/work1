# Standalone AI stack (haystack + document-extraction + ollama + qdrant).
# Full Insursa on-prem stack (API/Admin + AI) lives in:
#   ../package-manager/compose/docker-compose.yml

name: app-ai

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.15.4}
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  haystack:
    build:
      context: .
      dockerfile: Dockerfile
    image: insursa-ai:${AI_VERSION:-local}
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-ollama}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-document_chunks}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  document-extraction:
    build:
      context: ./document-extraction-service
      dockerfile: Dockerfile
    image: insursa-doc-extract:${DOC_EXTRACT_VERSION:-local}
    ports:
      - "${DOC_EXTRACT_HOST_PORT:-8001}:8001"
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      TESSERACT_LANG: ${TESSERACT_LANG:-eng}
      LAYOUT_PROVIDER: ${LAYOUT_PROVIDER:-paddleocr}
      LAYOUT_MODEL: ${LAYOUT_MODEL:-PP-DocLayout_plus-L}
      TEXT_OCR_PROVIDER: ${TEXT_OCR_PROVIDER:-tesseract}
      EXTRACTION_DEBUG: ${EXTRACTION_DEBUG:-false}
      EXTRACTION_DEBUG_DIR: ${EXTRACTION_DEBUG_DIR:-/app/debug/extraction}
      PDF_OCR_DPI: ${PDF_OCR_DPI:-200}
      SCANNED_MIN_TEXT_CHARS: ${SCANNED_MIN_TEXT_CHARS:-20}
    volumes:
      - doc_extract_debug:/app/debug/extraction
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  qdrant_data:
  ollama_data:
  doc_extract_debug:
